appId: com.funkpay.funkpayai
productName: FunkPay MCP
copyright: Copyright © 2026 FunkPay

directories:
  buildResources: build
  output: dist

files:
  - out/**/*

mac:
  category: public.app-category.finance
  target:
    - target: dmg
    - target: zip
  artifactName: FunkPayMCP-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
  artifactName: FunkPayMCP-Setup-${version}.${ext}

linux:
  target:
    - target: AppImage
    - target: deb
  artifactName: FunkPayMCP-${version}-${arch}.${ext}
  category: Finance
