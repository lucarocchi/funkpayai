appId: com.funkpay.funkpayai
productName: FunkPayAI
copyright: Copyright © 2026 FunkPay

directories:
  buildResources: build
  output: dist

files:
  - out/**/*

# Bitcoind binaries bundled per platform
extraResources:
  - from: resources/bitcoind/${os}-${arch}
    to: bitcoind
    filter:
      - "**"

mac:
  category: public.app-category.finance
  target:
    - target: dmg
    - target: zip
  artifactName: FunkPayAI-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
  artifactName: FunkPayAI-Setup-${version}.${ext}

linux:
  target:
    - target: AppImage
    - target: deb
  artifactName: FunkPayAI-${version}-${arch}.${ext}
  category: Finance
