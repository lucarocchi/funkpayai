appId: com.funkpay.funkpayai
productName: FunkPay MCP
copyright: Copyright © 2026 FunkPay

directories:
  buildResources: build
  output: dist

files:
  - out/**/*

extraResources:
  - from: scripts/mcp-stdio.mjs
    to: mcp-stdio.mjs

mac:
  category: public.app-category.finance
  identity: "Luca Rocchi (CXK587548Z)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
  artifactName: FunkPayMCP-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
  artifactName: FunkPayMCP-Setup-${version}.${ext}

linux:
  target:
    - target: AppImage
    - target: deb
  artifactName: FunkPayMCP-${version}-${arch}.${ext}
  category: Finance
